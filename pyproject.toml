[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba"
version = "0.1.0"
description = "三連複予想の検証用パッケージ（実購入はしない）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "lxml>=5",
  "pdfplumber>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
keiba = "keiba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
